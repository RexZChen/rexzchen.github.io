<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>~/thoughts - Zirong Chen</title>
    <meta name="theme-color" content="#f6f2ea">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161b22'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='%232f9e54' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace;
            --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

            --primary-color: #211d18;
            --secondary-color: #8f5230;
            --secondary-hover: #743f22;
            --accent-color: #a8643c;
            --text-dark: #211d18;
            --text-light: #635b51;
            --bg-light: #f6f2ea;
            --bg-white: #faf7f0;
            --border-color: #e6ded0;
            --shadow: 0 1px 2px rgba(33,29,24,0.06);
        }

        [data-theme="dark"] {
            --primary-color: #ece5da;
            --secondary-color: #d08a5e;
            --secondary-hover: #e0a079;
            --accent-color: #d08a5e;
            --text-dark: #ece5da;
            --text-light: #a59a8c;
            --bg-light: #1a1714;
            --bg-white: #221d18;
            --border-color: rgba(236,229,218,0.10);
            --shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--sans);
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text-dark);
            background-color: var(--bg-light);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        ::selection {
            background: color-mix(in srgb, var(--accent-color) 22%, transparent);
        }

        /* Header */
        header {
            max-width: 760px;
            margin: 0 auto;
            padding: 3.5rem 2rem 1.6rem;
        }

        header h1 {
            font-family: var(--mono);
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: var(--primary-color);
        }

        .header-sub {
            margin-top: 0.8rem;
            color: var(--text-light);
            font-size: 0.92rem;
            max-width: 58ch;
            text-wrap: pretty;
        }

        .header-nav {
            margin-top: 1.2rem;
            font-family: var(--mono);
            font-size: 0.85rem;
        }

        .header-nav .prompt { color: var(--text-light); }

        .header-nav a {
            color: var(--secondary-color);
            text-decoration: none;
            transition: color 0.18s ease;
        }

        .header-nav a:hover {
            color: var(--secondary-hover);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            z-index: 1001;
            transition: border-color 0.18s ease;
        }

        .theme-toggle:hover { border-color: var(--secondary-color); }

        .theme-toggle svg {
            width: 20px;
            height: 20px;
            fill: var(--primary-color);
            stroke: var(--primary-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .theme-toggle svg circle,
        .theme-toggle svg line { fill: none; }

        /* Main */
        main {
            max-width: 760px;
            margin: 1rem auto 0;
            padding: 0 2rem 4rem;
        }

        /* Tag filters */
        .filters {
            display: flex;
            gap: 1.3rem;
            margin-bottom: 1.6rem;
            padding-bottom: 1rem;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--mono);
        }

        .filter-btn {
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            padding: 0.2rem 0;
            color: var(--text-light);
            cursor: pointer;
            font-family: var(--mono);
            font-size: 0.82rem;
            transition: color 0.18s ease, border-color 0.18s ease;
        }

        .filter-btn:hover { color: var(--text-dark); }

        .filter-btn.active {
            color: var(--secondary-color);
            border-bottom-color: var(--secondary-color);
        }

        /* Post entries */
        .post { border-bottom: 1px solid var(--border-color); }

        .post-header {
            display: flex;
            align-items: baseline;
            gap: 0.9rem;
            padding: 1.1rem 0;
            cursor: pointer;
            user-select: none;
        }

        .post-toggle {
            font-family: var(--mono);
            color: var(--text-light);
            font-size: 0.85rem;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .post.open .post-toggle { transform: rotate(90deg); }

        .post-meta { flex: 1; min-width: 0; }

        .post-title {
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .post-date {
            font-family: var(--mono);
            font-size: 0.76rem;
            color: var(--text-light);
            margin-top: 0.2rem;
        }

        .post-tag {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-light);
            flex-shrink: 0;
        }

        .post-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }

        .post.open .post-body { max-height: 4000px; }

        .post-content {
            padding: 0 0 1.5rem 1.7rem;
            font-size: 0.95rem;
            line-height: 1.8;
            color: var(--text-light);
            max-width: 64ch;
            text-wrap: pretty;
        }

        .post-content p { margin-bottom: 1rem; }
        .post-content p:last-child { margin-bottom: 0; }

        .post-content a {
            color: var(--secondary-color);
            text-decoration: none;
            text-underline-offset: 3px;
        }

        .post-content a:hover { text-decoration: underline; }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
        }

        .post-content pre {
            background: var(--bg-white);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            font-family: var(--mono);
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .post-content h2,
        .post-content h3,
        .post-content h4 { color: var(--text-dark); }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem 0;
            font-family: var(--mono);
            color: var(--text-light);
        }

        .empty-state .prompt {
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
        }

        /* Footer */
        footer {
            max-width: 760px;
            margin: 0 auto;
            padding: 1.8rem 2rem 2.4rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-light);
            font-family: var(--mono);
            font-size: 0.78rem;
            opacity: 0.6;
        }

        @media (max-width: 768px) {
            header { padding: 2.5rem 1.25rem 1.4rem; }
            main { padding: 0 1.25rem 3rem; }
            footer { padding: 1.6rem 1.25rem 2rem; }
            .theme-toggle { top: 15px; right: 15px; }
        }

        /* ===== Warm aurora glass =====
           Web glassmorphism approximation (NOT official Apple Liquid Glass). Matches the
           homepage: a faint warm aurora behind the page, and each thought floats as a
           frosted glass card. The header, filters and footer stay flat over the aurora. */
        :root {
            --glass-blur: blur(20px) saturate(180%);
            --glass-bg: linear-gradient(135deg, rgba(255,250,242,0.58), rgba(255,246,236,0.26));
            --glass-border: rgba(255,255,255,0.5);
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 16px 44px rgba(80,55,35,0.12);
        }

        [data-theme="dark"] {
            --glass-bg: linear-gradient(135deg, rgba(78,62,50,0.5), rgba(38,31,25,0.44));
            --glass-border: rgba(236,229,218,0.15);
            --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 16px 44px rgba(0,0,0,0.5);
        }

        /* Warm aurora field, fixed behind all content (z-index keeps it under the text) */
        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(38% 48% at 18% 22%, rgba(208,138,94,0.20), transparent 60%),
                radial-gradient(34% 44% at 82% 16%, rgba(168,100,60,0.16), transparent 62%),
                radial-gradient(44% 52% at 74% 82%, rgba(143,82,48,0.15), transparent 64%),
                radial-gradient(38% 44% at 24% 88%, rgba(230,200,150,0.17), transparent 62%);
            filter: blur(16px);
            animation: auroraDrift 42s ease-in-out infinite alternate;
        }

        [data-theme="dark"] body::before {
            background:
                radial-gradient(38% 48% at 18% 22%, rgba(208,138,94,0.16), transparent 60%),
                radial-gradient(34% 44% at 82% 16%, rgba(120,72,44,0.20), transparent 62%),
                radial-gradient(44% 52% at 74% 82%, rgba(96,60,40,0.24), transparent 64%),
                radial-gradient(38% 44% at 24% 88%, rgba(150,110,70,0.14), transparent 62%);
        }

        @keyframes auroraDrift {
            0%   { transform: translate3d(-1.5%, -1%, 0) scale(1.03); }
            100% { transform: translate3d(1.5%, 2%, 0) scale(1.07); }
        }

        /* Theme toggle as glass */
        .theme-toggle {
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* Each thought floats as its own frosted glass card */
        .post {
            margin-bottom: 1rem;
            padding: 0 1.6rem;
            border-bottom: none;
            border-radius: 16px;
            background: var(--glass-bg);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        @media (max-width: 768px) {
            .post { padding: 0 1.2rem; }
        }

        /* Fallbacks: drop the aurora and serve solid panels */
        @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
            .theme-toggle, .post { background: var(--bg-white); }
        }
        @media (prefers-reduced-transparency: reduce) {
            body::before { display: none; }
            .theme-toggle, .post {
                background: var(--bg-white);
                -webkit-backdrop-filter: none;
                backdrop-filter: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
                animation: none !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <header>
        <h1>~/random_thoughts</h1>
        <p class="header-sub">notes on research, life, and everything in between. if you found this page, congrats, you're either very curious or very bored. either way, welcome.</p>
        <p class="header-nav"><span class="prompt">$</span> <a href="index.html">cd ~/home</a></p>
    </header>

    <main>
        <div class="filters" id="filters"></div>
        <div id="posts"></div>
    </main>

    <footer>
        <p>EOF</p>
    </footer>

    <script>
        // Lightweight markdown renderer (handles paragraphs, bold, italic, links, images, code blocks, headings, lists, hr)
        function renderMarkdown(md) {
            let html = md
                // code blocks
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                // inline code
                .replace(/`([^`]+)`/g, '<code style="background:var(--border-color);padding:2px 6px;border-radius:4px;font-size:0.9em;">$1</code>')
                // images
                .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:1rem 0;border:1px solid var(--border-color);">')
                // links
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                // headings
                .replace(/^### (.+)$/gm, '<h4 style="margin:1rem 0 0.5rem;color:var(--text-dark);">$1</h4>')
                .replace(/^## (.+)$/gm, '<h3 style="margin:1.2rem 0 0.5rem;color:var(--text-dark);">$1</h3>')
                .replace(/^# (.+)$/gm, '<h2 style="margin:1.5rem 0 0.5rem;color:var(--text-dark);">$1</h2>')
                // bold & italic
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                // horizontal rule
                .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border-color);margin:1.5rem 0;">')
                // unordered lists
                .replace(/^- (.+)$/gm, '<li>$1</li>');

            // wrap consecutive <li> in <ul>
            html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul style="list-style:disc;padding-left:1.5rem;margin:0.5rem 0;">$1</ul>');

            // paragraphs: split by double newlines, wrap non-tag blocks in <p>
            html = html.split(/\n\n+/).map(block => {
                block = block.trim();
                if (!block) return '';
                if (/^<[a-z]/.test(block)) return block;
                return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
            }).join('\n');

            return html;
        }

        // State
        let posts = [];
        let activeTag = 'all';
        const contentCache = {};
        const filtersEl = document.getElementById('filters');
        const postsEl = document.getElementById('posts');

        // Fetch manifest and render
        fetch('thoughts/posts.json')
            .then(r => r.json())
            .then(data => {
                posts = data.sort((a, b) => b.date.localeCompare(a.date));
                buildFilters();
                renderPosts();
            })
            .catch(() => {
                postsEl.innerHTML = `
                    <div class="empty-state">
                        <div class="prompt">$ cat thoughts.txt</div>
                        <div>error: could not load posts.</div>
                    </div>`;
            });

        function buildFilters() {
            const tags = ['all', ...new Set(posts.map(p => p.tag))];
            filtersEl.innerHTML = '';
            tags.forEach(tag => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${tag === activeTag ? 'active' : ''}`;
                btn.dataset.tag = tag;
                btn.textContent = `[${tag}]`;
                btn.addEventListener('click', () => {
                    activeTag = tag;
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderPosts();
                });
                filtersEl.appendChild(btn);
            });
        }

        function renderPosts() {
            const filtered = activeTag === 'all' ? posts : posts.filter(p => p.tag === activeTag);

            if (filtered.length === 0) {
                postsEl.innerHTML = `
                    <div class="empty-state">
                        <div class="prompt">$ cat thoughts.txt</div>
                        <div>no entries found.</div>
                    </div>`;
                return;
            }

            postsEl.innerHTML = filtered.map((post) => `
                <div class="post" data-tag="${post.tag}" data-file="${post.file}">
                    <div class="post-header" onclick="togglePost(this.parentElement)">
                        <span class="post-toggle">></span>
                        <div class="post-meta">
                            <div class="post-title">${post.title}</div>
                            <div class="post-date">${post.date}</div>
                        </div>
                        <span class="post-tag ${post.tag}">${post.tag}</span>
                    </div>
                    <div class="post-body">
                        <div class="post-content"><span style="color:var(--text-light);opacity:0.6;font-family:var(--mono);font-size:0.85rem;">loading...</span></div>
                    </div>
                </div>
            `).join('');
        }

        function togglePost(postEl) {
            const isOpening = !postEl.classList.contains('open');
            postEl.classList.toggle('open');

            if (isOpening) {
                const file = postEl.dataset.file;
                const contentEl = postEl.querySelector('.post-content');

                if (contentCache[file]) {
                    contentEl.innerHTML = contentCache[file];
                    return;
                }

                fetch('thoughts/' + file)
                    .then(r => {
                        if (!r.ok) throw new Error('Not found');
                        return r.text();
                    })
                    .then(md => {
                        const html = renderMarkdown(md);
                        contentCache[file] = html;
                        contentEl.innerHTML = html;
                    })
                    .catch(() => {
                        contentEl.innerHTML = '<span style="color:var(--accent-color);font-family:var(--mono);font-size:0.85rem;">error: could not load post.</span>';
                    });
            }
        }

        // Theme toggle (synced with main site via localStorage)
        const themeToggle = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const root = document.documentElement;

        const savedTheme = localStorage.getItem('theme') || 'light';
        root.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            root.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateThemeIcon(next);
        });

        function updateThemeIcon(theme) {
            const dark = theme === 'dark';
            sunIcon.style.display = dark ? 'block' : 'none';
            moonIcon.style.display = dark ? 'none' : 'block';
        }
    </script>
</body>
</html>
