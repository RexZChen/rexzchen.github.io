<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - Zirong Chen</title>
    <meta name="theme-color" content="#f3f3f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1319" media="(prefers-color-scheme: dark)">

    <!-- Favicon: an off-centre Nordic cross in the site's own blue and ochre -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%231c4a75'/%3E%3Crect y='14' width='32' height='4' fill='%23b0812c'/%3E%3Crect x='10' width='4' height='32' fill='%23b0812c'/%3E%3C/svg%3E">

    <!-- Set the theme before first paint so dark-mode users never see a light flash. -->
    <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.setAttribute('data-theme',t);}catch(e){d.setAttribute('data-theme','light');}})();</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/site.css?v=19">
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <main class="nf">
        <p class="eyebrow">Error &middot; page not found</p>
        <p class="nf-code">404</p>
        <p class="nf-body">This address does not resolve to anything on the site. The page may have
        moved, or the link that brought you here may be out of date.</p>
        <nav class="nf-links">
            <a href="index.html">Back to home</a>
            <a href="index.html#contact">Publications</a>
            <a href="thoughts.html">Random thoughts</a>
        </nav>
    </main>

    <script>
        // Theme toggle. data-theme is already set pre-paint by the head script, icon
        // visibility is CSS-driven, and the choice is shared with the other pages
        // via localStorage.
        const root = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const themeMetas = document.querySelectorAll('meta[name="theme-color"]');
        const PAPER = { light: '#f3f3f0', dark: '#0f1319' };

        function syncThemeColor(theme) {
            themeMetas.forEach(m => m.setAttribute('content', PAPER[theme]));
        }
        syncThemeColor(root.getAttribute('data-theme') || 'light');

        themeToggle.addEventListener('click', () => {
            const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            syncThemeColor(next);
        });
    </script>
</body>
</html>
